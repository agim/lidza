# Dependency updates, weekly, grouped: one pull request per ecosystem
# and directory for minor and patch versions, a separate one per major.
# Security updates come as they are published, whatever the schedule.
version: 2
updates:
  # The framework, the CLI and the packs.
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      go:
        update-types: [minor, patch]

  # The reference app (its snippets are regenerated from it:
  # go generate ./pkg/snippets after merging).
  - package-ecosystem: gomod
    directory: /examples/notes
    schedule: { interval: weekly, day: monday }
    groups:
      notes-go:
        update-types: [minor, patch]

  # The app templates new apps start from, and the reference app that
  # mirrors the react one: one group, so they never drift apart; majors
  # (a new TypeScript, ESLint or React) in a group of their own, taken
  # for all of them in one deliberate change. @types/node follows
  # the Node the apps run (22), never ahead of it.
  - package-ecosystem: npm
    directories: [/examples/notes, /templates/react, /templates/svelte, /templates/astro]
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  # The Rust core and the official Rust packs.
  - package-ecosystem: cargo
    directories:
      - /core
      - /pkg/pack/official/media/rust
      - /pkg/pack/official/geo/rust
      - /examples/notes/packs/stats/rust
    schedule: { interval: weekly, day: monday }
    groups:
      rust:
        update-types: [minor, patch]

  # The CI workflow's actions.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        update-types: [minor, patch]
